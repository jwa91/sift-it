[workspace]
members = ["crates/llama", "crates/protocol"]
default-members = [".", "crates/llama", "crates/protocol"]

# One version for the binary and its crates: a release bumps it here.
[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"

[package]
name = "sift-it"
description = "Local file search for macOS: search files by what's in them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
block2 = "0.6.2"
clap = { version = "4.6.7", features = ["derive"] }
embedder = { package = "sift-it-llama", path = "crates/llama" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
notify = "8"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["AVAudioBuffer", "AVAudioConverter", "AVAudioFormat", "AVAudioTypes", "block2", "objc2-core-media"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-image-io = "0.3.2"
objc2-pdf-kit = "0.3.2"
objc2-vision = "0.3.2"
protocol = { package = "sift-it-protocol", path = "crates/protocol", features = ["clap"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
sha1 = "0.11.0"
sha2 = "0.11.1"
ureq = "3.4.2"

