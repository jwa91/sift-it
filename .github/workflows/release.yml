name: Release

# Manual-only, and it doesn't publish: a cask must be signed and notarized,
# and the Developer ID certificate and notarytool login live in the
# releasing Mac's keychain, not in CI. Local releases via
# `make release VERSION=X.Y.Z` are the canonical path.
# This builds what a release would and checks it.
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Run checks
        run: make check

  snapshot:
    name: Snapshot
    runs-on: macos-15
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Everything a release makes (unsigned here), without publishing it.
      - name: Build the release archive and cask
        run: make snapshot

      - name: Smoke the archive
        run: |
          set -eu
          cd dist
          shasum -a 256 -c checksums.txt
          mkdir smoke && tar -xzf sift-it_*_darwin_arm64.tar.gz -C smoke
          smoke/sift-it --version
          smoke/sift-it estimate . > /dev/null
