name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Apple Silicon: sift builds llama.cpp with Metal and links Apple's frameworks.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # fmt, clippy (warnings are errors) and unit tests. The model-dependent checks (make selftest, make eval)
      # need the 865 MB model and run locally before a release.
      - name: Run checks
        run: make check
