[package]
name = "sift-it-transcribe"
version.workspace = true
edition.workspace = true
description = "sift-it's speech-to-text helper: transcribe.cpp in a process of its own, beside the engine's llama.cpp"
license.workspace = true
publish = false

[[bin]]
name = "sift-it-transcribe"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["metal"] }
