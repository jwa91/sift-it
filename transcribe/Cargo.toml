[package]
name = "sift-it-transcribe"
version = "0.1.3"
edition = "2024"
description = "sift-it's speech-to-text helper: transcribe.cpp in a process of its own, beside the engine's llama.cpp"
license = "MIT"
publish = false

[[bin]]
name = "sift-it-transcribe"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["metal"] }
